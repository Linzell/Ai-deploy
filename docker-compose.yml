# ============================================================================
# Docker Compose for Maiia AI Inference Service
# ============================================================================
#
# Usage:
#   docker compose up                              # Start echo task (default)
#   docker compose up -d                           # Start in background
#
# Run a specific model (no TOML config needed):
#   MODEL=Xenova/bge-m3 docker compose up
#   MODEL=Qwen/Qwen2.5-0.5B-Instruct docker compose up
#
# Run from a TOML preset:
#   CONFIG=configs/foundation/bge-m3.toml docker compose up
#
# Build with optional backends:
#   FEATURES=candle docker compose up --build
#   FEATURES=llama docker compose up --build
#   FEATURES="candle,llama" docker compose up --build
#
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # Inference Service
  # ---------------------------------------------------------------------------
  inference:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - FEATURES=${FEATURES:-}
    ports:
      - "50051:50051"  # gRPC
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      # S3/MinIO configuration (optional)
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
    # Default: run echo task. Override with MODEL or CONFIG env vars.
    # Examples:
    #   MODEL=Xenova/bge-m3 docker compose up
    #   CONFIG=configs/foundation/bge-m3.toml docker compose up
    command: ${MODEL:+--model ${MODEL}} ${CONFIG:+--config /app/${CONFIG}} ${MODEL:-${CONFIG:---config /app/configs/echo.toml}}
    volumes:
      # Mount config presets (for --config mode)
      - ./configs:/app/configs:ro
      # Mount models directory (for local models)
      - ./models:/app/models:ro
      # Persistent cache for downloaded models
      - model-cache:/tmp/inference-cache
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["/bin/grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Uncomment for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # MinIO (S3-compatible storage for development)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO Initialization (create buckets)
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/models --ignore-existing;
      mc mb local/data --ignore-existing;
      echo 'Buckets initialized';
      exit 0;
      "

volumes:
  model-cache:
    name: maiia-inference-cache
  minio-data:
    name: maiia-minio-data
