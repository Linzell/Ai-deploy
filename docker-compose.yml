# ============================================================================
# Docker Compose for Maiia AI Inference Service
# ============================================================================
#
# Backends: ONNX (default), Candle (Rust-native LLMs), llama.cpp (GGUF models)
#
# Usage:
#   docker compose up                    # Start with echo task (default, ONNX only)
#   docker compose up -d                 # Start in background
#
# Run specific task:
#   TASK_CONFIG=nlp/feature-extraction.toml docker compose up
#   TASK_CONFIG=audio/automatic-speech-recognition.toml docker compose up
#   TASK_CONFIG=vision/image-classification.toml docker compose up
#
# Build with optional backends:
#   FEATURES=candle docker compose up --build          # Enable Candle backend
#   FEATURES=llama docker compose up --build           # Enable llama.cpp backend
#   FEATURES="candle,llama" docker compose up --build  # Enable all backends
#
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # Inference Service
  # ---------------------------------------------------------------------------
  inference:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - FEATURES=${FEATURES:-}
    ports:
      - "50051:50051"  # gRPC
      - "8080:8080"    # Health check
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - MAIIA_AI_CONFIG_PATH=/app/configs/${TASK_CONFIG:-echo.toml}
      # S3/MinIO configuration (optional)
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
    volumes:
      # Mount all config directories
      - ./configs:/app/configs:ro
      # Mount models directory (for local models)
      - ./models:/app/models:ro
      # Persistent cache for downloaded models
      - model-cache:/tmp/inference-cache
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    # Uncomment for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # MinIO (S3-compatible storage for development)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO Initialization (create buckets)
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/models --ignore-existing;
      mc mb local/data --ignore-existing;
      echo 'Buckets initialized';
      exit 0;
      "

volumes:
  model-cache:
    name: maiia-inference-cache
  minio-data:
    name: maiia-minio-data
