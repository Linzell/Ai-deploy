# Sentence Similarity / Semantic Search
# HuggingFace task: sentence-similarity
#
# Test with text pair (service handles tokenization):
#   grpcurl -plaintext -d '{"task_name":"maiia.sentence-similarity.v1","payload":"{\"text_a\":\"The cat sat on the mat.\",\"text_b\":\"A feline rested on the rug.\"}","request_id":"1"}' \
#     127.0.0.1:50051 maiia.worker.v1.WorkerService/ExecuteTask
#
# Computes similarity scores between sentences (uses embeddings internally).
#
# Input format:
#   {"text_a": "First sentence", "text_b": "Second sentence"}
#   {"text": "Single sentence for embedding"}
#
# Output format:
#   {"outputs": {"sentence_embedding": [[0.1, 0.2, ...]]}}

[task]
type = "sentence-similarity"
name = "maiia.sentence-similarity.v1"

[model]
path = "Xenova/all-MiniLM-L6-v2"
onnx_file = "onnx/model.onnx"

[service]
name = "maiia-sentence-similarity-worker"
max_batch_size = 64
batch_timeout_ms = 50
