# Text Generation / LLM
# HuggingFace task: text-generation
#
# Test with raw text (service handles tokenization):
#   grpcurl -plaintext -d '{"task_name":"maiia.qwen-3_5-35B.v1","payload":"{\"text\":\"Once upon a time\"}","request_id":"1"}' \
#     127.0.0.1:50051 maiia.worker.v1.WorkerService/ExecuteTask
#
# Generates text continuations (chat, completion, creative writing).
#
# BACKEND SELECTION:
#   - backend = "candle" (default for text-generation) - Uses candle for modern LLMs (Qwen, Llama, Mistral)
#   - backend = "onnx" - Uses ONNX Runtime (for ONNX-exported models)
#   - backend = "auto" - Auto-selects (candle for text-generation, onnx for others)
#
# Candle-supported models (safetensors, no ONNX needed):
#   - Qwen/Qwen2.5-0.5B-Instruct (0.5B, modern, recommended for CPU)
#   - meta-llama/Llama-3.2-1B-Instruct (1B params)
#   - mistralai/Mistral-7B-Instruct-v0.3 (7B params, needs GPU)
#
# ONNX models (for backend = "onnx"):
#   - onnx-community/Qwen2.5-0.5B-Instruct
#   - HuggingFaceTB/SmolLM2-135M-Instruct (tiny, fast)
#
# Available GGUF files:
#   The `unsloth/Qwen3.5-35B-A3B-GGUF` repo likely has multiple quantization options.
#   Common naming patterns:
#     | File           | Size         | Quality             |
#     |----------------|--------------|---------------------|
#     | *-Q2_K.gguf    | Smallest     | Lower quality       |
#     | *-Q4_K_M.gguf  | Medium       | Good balance        |
#     | *-Q4_K_XL.gguf | Medium-Large | Better quality      |
#     | *-Q5_K_M.gguf  | Large        | High quality        |
#     | *-Q8_0.gguf    | Largest      | Near full precision |
#
# Input format:
#   {"text": "Once upon a time"}
#
# Output format:
#   {"text": "generated continuation...", "num_tokens": 50}

[task]
type = "text-generation"
name = "maiia.qwen-3_5-35B.v1"

[model]
source = "huggingface"
path = "unsloth/Qwen3.5-35B-A3B-GGUF"
gguf_file = "Qwen3.5-35B-A3B-UD-Q4_K_XL.gguf" # Pick the quantization you want
# For ONNX backend, use:
# path = "onnx-community/Qwen2.5-0.5B-Instruct"
# onnx_file = "onnx/model.onnx"

[inference]
backend = "llama"
device = "gpu" # Auto-resolves to Metal on macOS, CUDA on Linux
# Falls back to CPU if GPU not available
max_tokens = 256
temperature = 0.7
top_p = 0.9
num_threads = 4

[service]
grpc_port = 50051
health_port = 8080
name = "maiia-qwen-3_5-35B-worker"
enable_batching = false # Autoregressive models batch differently
