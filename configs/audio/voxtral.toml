# Voxtral - Speech-to-Text / Audio Language Model
# Task type: automatic-speech-recognition
#
# Test with base64-encoded audio:
#   grpcurl -plaintext -d '{"task_name":"maiia.voxtral.v1","payload":"{\"audio\":\"'$(base64 -i audio.wav)'\"}","request_id":"1"}' \
#     127.0.0.1:50051 maiia.worker.v1.WorkerService/ExecuteTask
#
# Voxtral is Mistral AI's speech-to-text model based on the Whisper architecture.
# It can transcribe audio with high accuracy.
#
# Backend: Candle (native Rust implementation)
# Uses the same Candle seq2seq backend as Whisper models.
#
# Models available:
#   - mistralai/Voxtral-Mini-3B-2507 (3B params, safetensors, requires HF_TOKEN)
#
# Note: This model requires a HuggingFace token to download (gated model).
# Set MAIIA_AI_HUGGINGFACE_TOKEN environment variable.
#
# Input format:
#   {"audio": "<base64-encoded WAV data>"}
#
# Output format:
#   {"text": "transcribed text from audio"}

[task]
type = "automatic-speech-recognition"
name = "maiia.voxtral.v1"

[model]
path = "mistralai/Voxtral-Mini-3B-2507" # Native safetensors (requires HF token)

[inference]
backend = "candle"                        # Use Candle for native safetensors
device = "gpu"                            # Use "metal" for Apple Silicon, "cuda" for NVIDIA
max_tokens = 512                          # Max transcription length
temperature = 0.0                         # Greedy decoding

[service]
name = "maiia-voxtral-worker"
enable_batching = false                   # ASR typically processes one audio at a time
