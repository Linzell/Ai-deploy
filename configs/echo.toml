# Echo task configuration
# Simple test task that echoes input back - no model required
#
# Test with:
#   grpcurl -plaintext -d '{"task_name":"maiia.echo.v1","payload":"{\"message\":\"Hello world!\",\"number\":42}","request_id":"1"}' \
#     127.0.0.1:50051 maiia.worker.v1.WorkerService/ExecuteTask

[task]
type = "echo"
name = "maiia.echo.v1"

[service]
name = "maiia-echo-worker"
enable_batching = false
