[package]
name = "inference-tasks"
version.workspace = true
edition.workspace = true
description = "Task implementations and registry for inference service (facade crate)"

[lints]
workspace = true

[features]
default = ["preprocess", "postprocess"]
# Enable preprocessing (tokenization, image, audio)
preprocess = ["dep:inference-preprocess"]
# Enable postprocessing (decode tokens, extract labels, format outputs)
postprocess = ["dep:inference-postprocess"]

# ONNX backend features (always available via inference-onnx)
coreml = ["inference-onnx/coreml"]
cuda = ["inference-onnx/cuda"]

# Candle backend for text-generation, seq2seq, and TTS
candle = ["dep:inference-candle"]
candle-metal = ["candle", "inference-candle/metal"]
candle-cuda = ["candle", "inference-candle/cuda"]

# Llama.cpp backend for GGUF models (GPT-OSS-20B, etc.)
llama = ["dep:inference-llama"]
llama-metal = ["llama", "inference-llama/metal"]
llama-cuda = ["llama", "inference-llama/cuda"]

[dependencies]
# Core crates
inference-core.path = "../inference-core"
inference-grpc.path = "../inference-grpc"
inference-loader-hf.path = "../inference-loader-hf"
inference-loader-s3.path = "../inference-loader-s3"
inference-preprocess = { path = "../inference-preprocess", optional = true }
inference-postprocess = { path = "../inference-postprocess", optional = true }

# Backend crates
inference-onnx.path = "../inference-onnx"
inference-candle = { path = "../inference-candle", optional = true }
inference-llama = { path = "../inference-llama", optional = true }

# Runtime
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
