[package]
name = "inference-service"
version.workspace = true
edition.workspace = true
description = "Main entrypoint for inference service"

[lints]
workspace = true

[features]
default = ["candle", "llama"]
# Metal GPU is auto-enabled on macOS via target-specific deps in inference-candle
# and inference-llama — no feature flag needed for macOS users.
# The "metal" feature below is kept for backward compatibility / explicit override.
metal = ["candle-metal", "llama-metal"]
# CUDA requires explicit opt-in (Linux/Windows only)
all-cuda = ["cuda", "candle-cuda", "llama-cuda"]
# CUDA support for Linux/Windows (NVIDIA GPU)
cuda = ["inference-tasks/cuda", "dep:nvml-wrapper"]
# Candle backend for text-generation (Rust-native ML)
candle = ["inference-tasks/candle"]
candle-metal = ["candle", "inference-tasks/candle-metal"]
candle-cuda = ["candle", "inference-tasks/candle-cuda"]
# Llama.cpp backend for GGUF models (GPT-OSS-20B, etc.)
llama = ["inference-tasks/llama"]
llama-metal = ["llama", "inference-tasks/llama-metal"]
llama-cuda = ["llama", "inference-tasks/llama-cuda"]
# TLS support for gRPC server
tls = ["inference-grpc/tls"]

[[bin]]
name = "inference-service"
path = "src/main.rs"

[dependencies]
# Workspace crates
inference-core = { path = "../inference-core" }
inference-loader-hf = { path = "../inference-loader-hf" }
inference-loader-s3 = { path = "../inference-loader-s3" }
inference-grpc = { path = "../inference-grpc" }
inference-tasks = { path = "../inference-tasks" }

# Runtime & async
tokio.workspace = true
async-trait.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# OpenTelemetry (env-gated at runtime — disabled unless OTEL_ENDPOINT is set)
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true

# Config
serde.workspace = true
serde_json.workspace = true

# CLI
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"

# HTTP client (for HuggingFace API)
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow.workspace = true

# .env file loading
dotenvy.workspace = true

# System metrics (process memory)
sysinfo.workspace = true

# GPU metrics (CUDA only — gated behind "cuda" feature)
nvml-wrapper = { workspace = true, optional = true }

[dev-dependencies]
uuid = { version = "1.0", features = ["v4"] }
tonic.workspace = true
serde_json.workspace = true
toml.workspace = true
base64 = "0.22"
criterion = { version = "0.5", features = ["async_tokio"] }
futures.workspace = true

[[bench]]
name = "inference_bench"
harness = false
