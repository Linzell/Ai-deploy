[package]
name = "inference-llama"
version.workspace = true
edition.workspace = true
description = "llama.cpp-based inference backend for GGUF models"

[lints]
workspace = true

[features]
default = []
# Explicit Metal/CUDA features kept for backward compatibility and manual override.
# On macOS, Metal is auto-enabled via target-specific deps below.
metal = ["llama-cpp-2/metal"]
# CUDA acceleration for Linux/Windows
cuda = ["llama-cpp-2/cuda"]

[dependencies]
inference-core.path = "../inference-core"

tokio.workspace = true
tokio-stream = "0.1"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true

# llama.cpp Rust bindings (CPU base)
# llama.cpp Rust bindings — using git for qwen35moe/qwen3.6 support
# (v0.1.145 on crates.io doesn't support the 3-element rope.dimension_sections
# format used by Qwen3.5/Qwen3.6 GGUF models; the fix is in the git main branch)
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs.git", branch = "main" }

# UTF-8 decoding for token output
encoding_rs = "0.8"

# Random number generation for sampling
rand = "0.8"

# Async streams
async-stream = "0.3"

# --- Auto-enable Metal on macOS ---
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs.git", branch = "main", features = ["metal"] }

[dev-dependencies]
tempfile = "3"
