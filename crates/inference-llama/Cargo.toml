[package]
name = "inference-llama"
version.workspace = true
edition.workspace = true
description = "llama.cpp-based inference backend for GGUF models"

[lints]
workspace = true

[features]
default = []
# Metal acceleration for macOS
metal = ["llama-cpp-2/metal"]
# CUDA acceleration for Linux/Windows
cuda = ["llama-cpp-2/cuda"]

[dependencies]
inference-core.path = "../inference-core"

tokio.workspace = true
tokio-stream = "0.1"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true

# llama.cpp Rust bindings
llama-cpp-2 = "0.1"

# UTF-8 decoding for token output
encoding_rs = "0.8"

# Random number generation for sampling
rand = "0.9"

# Async streams
async-stream = "0.3"

[dev-dependencies]
tempfile = "3"
