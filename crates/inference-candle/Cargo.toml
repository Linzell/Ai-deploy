[package]
name = "inference-candle"
version.workspace = true
edition.workspace = true
description = "Candle-based inference backend for text generation, seq2seq, and TTS"

[lints]
workspace = true

[features]
default = []
# Explicit Metal/CUDA features kept for backward compatibility and manual override.
# On macOS, Metal is auto-enabled via target-specific deps below — these features
# are only needed if you want to force GPU on a platform where it's not auto-detected.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
# CUDA acceleration for Linux/Windows (NVIDIA GPU)
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
inference-core.path = "../inference-core"

tokio.workspace = true
tokio-stream = "0.1"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
futures.workspace = true
thiserror.workspace = true

# Candle ML framework (CPU-only base)
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true

# Tokenizers
tokenizers = "0.22"

# Tekken tokenizer for Voxtral
tekken-rs = "0.1"

# Safetensors parsing (for safe loading)
safetensors = "0.7"

# Random number generation
rand = "0.8"

# Audio processing
hound = "3.5"

# Base64 for audio data
base64 = "0.22"

# Async streams
async-stream = "0.3"

# --- Auto-enable Metal on macOS (Apple Silicon / Apple GPU) ---
# With resolver = "2", these features are only activated when targeting macOS.
# On Linux/Windows, the base CPU-only candle deps above are used.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }
candle-transformers = { workspace = true, features = ["metal"] }

[dev-dependencies]
tempfile = "3"
