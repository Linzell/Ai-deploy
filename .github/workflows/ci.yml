name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # Faster builds: share target dir across jobs via cache
  CARGO_INCREMENTAL: 0
  # Note: Do NOT set RUSTFLAGS="-D warnings" globally — it overrides the
  # workspace [lints] table and turns pedantic clippy warnings into errors.
  # Each job handles warning strictness individually.

jobs:
  # ===========================================================================
  # Job 1: Format check (fast, fail-fast)
  # ===========================================================================
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ===========================================================================
  # Job 2: Clippy lints
  # ===========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ===========================================================================
  # Job 3: Build check (cargo check)
  # ===========================================================================
  check:
    name: Check
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # ===========================================================================
  # Job 4: Tests (includes config validation of all 35+ TOML configs)
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [check, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Verify config validation test ran
        run: cargo test -p inference-core test_all_config_files_parse_and_validate -- --nocapture

  # ===========================================================================
  # Job 5: Docker build smoke test
  # ===========================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (default ONNX backend)
        run: docker build -t inference-service:ci-test .
      - name: Verify binary runs --help
        run: |
          docker run --rm inference-service:ci-test --help
      - name: Verify grpc_health_probe is installed
        run: |
          docker run --rm --entrypoint /bin/grpc_health_probe inference-service:ci-test --version
