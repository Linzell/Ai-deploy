name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.94.0"

jobs:
  # ===========================================================================
  # Job 1: Format check (fast, fail-fast)
  # ===========================================================================
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ===========================================================================
  # Job 2: Clippy lints
  # ===========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      # Default features (candle, llama, http, grpc)
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # CUDA features (catches cuda-gated code)
      - run: cargo clippy --workspace --all-targets --features "http,grpc,candle,llama,cuda" -- -D warnings

  # ===========================================================================
  # Job 3: Build check
  # ===========================================================================
  check:
    name: Check
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo check --workspace --all-targets --features "http,grpc,candle,llama,cuda"

  # ===========================================================================
  # Job 4: Tests
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [check, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Verify config validation test ran
        run: cargo test -p inference-core test_all_config_files_parse_and_validate -- --nocapture

  # ===========================================================================
  # Job 5: Security audit
  # ===========================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit

  # ===========================================================================
  # Job 6: Docker build smoke test
  # ===========================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [security, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t inference-service:ci-test .
      - name: Verify binary runs --help
        run: docker run --rm inference-service:ci-test --help
      - name: Verify grpc_health_probe is installed
        run: docker run --rm --entrypoint /bin/grpc_health_probe inference-service:ci-test --version