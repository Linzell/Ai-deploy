name: Benchmarks

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bench:
    name: Criterion Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate cache for benchmarks (release profile)
          key: bench

      - name: Run benchmarks
        run: |
          cargo bench --package inference-service --bench inference_bench -- --output-format bencher 2>&1 \
            | grep '^bench:' > bench-output.txt
          echo "Benchmark results:"
          cat bench-output.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Inference Service Benchmarks
          tool: cargo
          output-file-path: bench-output.txt
          # Comment on PR with benchmark comparison
          comment-on-alert: true
          alert-comment-cc-users: "@Linzell"
          # Fail if performance regresses by more than 200%
          alert-threshold: "200%"
          fail-on-alert: false
          # Store results in gh-pages branch for historical tracking
          auto-push: false
          # Show results as PR comment
          comment-always: true
          github-token: ${{ secrets.GITHUB_TOKEN }}